{% extends "home.html" %}
{% block body %}
<div style="display: flex; gap: 2rem; align-items: flex-start; padding: 2rem; flex-wrap: wrap;">

  <!-- Book Cover -->
  <div style="flex: 1; min-width: 200px;">
    <img src="{{ url_for('static', filename=recipe[3]) }}" alt="{{ recipe[1] }}" width="200" height="300">
  </div>

  <!-- Main Info -->
  <div style="flex: 2; min-width: 300px;">
    <h2>{{ recipe[1] }}</h2> <!--Title-->
    <h3>by {{ recipe[3] }}</h3> <!-- Author -->
    <p>{{ recipe[7] }}</p> <!-- Description -->
  </div>
<div style="display: flex; gap: 2rem; align-items: flex-start; padding: 2rem; flex-wrap: wrap;">

  
  <div style="flex: 1; min-width: 200px;">
    <img src="{{ url_for('static', filename=recipe[3]) }}" alt="{{ recipe[1] }}" width="200" height="300">
  </div>

  
  <div style="flex: 2; min-width: 300px;">
    <h2>{{ recipe[1] }}</h2> 
    <h3>by {{ recipe[3] }}</h3> 
  </div>

  
  <div style="flex: 1; min-width: 200px;">
    <p><strong>Ingredients:</strong> {{ recipe[4] }}</p>
    <p><strong>Creator:</strong> {{ recipe[2] }}</p>
    <p><strong>Category:</strong> {{ recipe[5] }}</p>
    <p><strong>Website:</strong> {{ recipe[6] }}</p>
    <p><strong>Recipelink:</strong> {{ recipe[7] }}</p>
  </div>

</div>
