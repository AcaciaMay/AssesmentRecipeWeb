{% extends "home.html" %}

{% block body %}
<style>
    .recipe-display-card {
        display: flex;
        background-color: #fff3d1; 
        border: 2px solid #000000;      /* Added crisp black outline */
        border-radius: 12px;           /* Added smooth rounded corners */
        padding: 15px;            
        gap: 20px;
        font-family: 'Alice', serif, Georgia, sans-serif;
        color: #111;
        width: 100%;
        max-width: 800px;         
        margin: 10px auto;
        box-sizing: border-box;
    }

    .recipe-column-visual {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-width: 200px;
    }

    .recipe-column-visual h1 {
        font-size: 1.8rem;        
        margin: 0;
        font-weight: normal;
        line-height: 1.2;
    }

    .recipe-image-wrapper img {
        width: 100%;
        max-height: 220px;        
        object-fit: cover;
        border: 1px solid #ccc;
        border-radius: 6px;        /* Optional: slightly rounds the image corners to match */
    }

    .recipe-column-details {
        flex: 1.3;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        gap: 8px;                 
        font-size: 1.05rem;       
        padding-top: 35px;        
    }

    .recipe-detail-row {
        margin: 0;
        line-height: 1.3;
    }

    .recipe-detail-row strong {
        font-weight: bold;
        display: inline-block;
        width: 110px;             
    }
</style>

<div class="recipe-display-card">

    <!-- Left side: Title and Image -->
    <div class="recipe-column-visual">
        <h1>{{ recipe[1] }}</h1> 
        
        <div class="recipe-image-wrapper">
            <img src="{{ url_for('static', filename=recipe[3]) }}" alt="{{ recipe[1] }}">
        </div>
    </div>

    <!-- Right side: Details with Colons -->
    <div class="recipe-column-details">
        <p class="recipe-detail-row"><strong>Creator:</strong> {{ recipe[2] }}</p>
        <p class="recipe-detail-row"><strong>Ingredients:</strong> {{ recipe[4] }}</p>
        <p class="recipe-detail-row"><strong>Category:</strong> {{ recipe[5] }}</p>
        <p class="recipe-detail-row"><strong>Allergy Warnings:</strong> {{ recipe[8] }}</p>
        <p class="recipe-detail-row"><strong>Website:</strong> {{ recipe[6] }}</p>
        <p class="recipe-detail-row">
            <strong>Recipe Link:</strong> 
            <a href="{{ recipe[7] }}" target="_blank" style="color: inherit; text-decoration: underline;">{{ recipe[7] }}</a>
        </p>
    </div>

</div>
{% endblock %}
