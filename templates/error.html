<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - RecipeWeb</title>
    <link rel="stylesheet" href="https://googleapis.com">
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body {
            background-color: #2e6f40; /* Forest green canvas match background color from wireframe */
            margin: 0;
            padding: 0;
            font-family: 'Alice', serif, Georgia, sans-serif;
            color: #111111;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1000px;
            width: 100%;
            padding: 40px;
            gap: 50px;
            box-sizing: border-box;
        }

        .text-section {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .error-code {
            font-size: 10rem;
            margin: 0;
            line-height: 0.9;
            font-weight: normal;
        }

        .error-message {
            font-size: 2.2rem;
            margin: 0;
            line-height: 1.3;
        }

        .input-box {
            display: flex;
            max-width: 400px;
            margin-top: 15px;
            border: 2px solid #111;
            background-color: #fff;
        }

        .input-box input {
            flex: 1;
            padding: 12px;
            border: none;
            outline: none;
            font-size: 1.1rem;
            font-family: inherit;
        }

        .input-box button {
            background: none;
            border: none;
            padding: 0 18px;
            cursor: pointer;
            font-size: 1.2rem;
        }

        .menu {
            list-style: none;
            padding: 0;
            margin: 25px 0 0 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .menu li a {
            color: #111111;
            text-decoration: underline;
            font-size: 1.2rem;
        }

        .menu li a:hover {
            opacity: 0.8;
        }

        .image-section {
            flex: 0.9;
            display: flex;
            justify-content: center;
        }

        .image-section img {
            width: 100%;
            max-width: 350px;
            height: auto;
        }
    </style>
</head>
<body>

<section>
   <div class="container">
     
     <div class="text-section">
       <h1 class="error-code">404</h1>
       <p class="error-message">Error can't seem to find the page you're looking for</p>
       
       <!-- Direct search bar fallback tool inside the view display panel -->
       <form action="/search" method="GET" class="input-box">
         <input type="text" name="query" value="{{ query }}" placeholder="Search alternative recipes...">
         <button type="submit"><i class="fa-solid fa-magnifying-glass"></i></button>
       </form>
       
       <ul class="menu">
         <li><a href="{{ url_for('home') }}">Go to Homepage</a></li>
       </ul>
     </div>
     
     <div class="image-section">
       <!-- Points directly to my barrier image stored inside the application's static directory folder assets -->
       <img class="image" src="{{ url_for('static', filename='errorimg.png') }}" alt="Page Not Found Warning Sign">
     </div>

   </div>
 </section>

</body>
</html>
