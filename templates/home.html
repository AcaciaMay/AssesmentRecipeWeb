<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecipeWeb</title>

    <link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">   
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Alice">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<div class="header-container">
  <div class="header-left">
    <h1 class="main-title">RecipeWeb</h1>
    <p class="subtitle">Discover delicious recipes for every occasion</p>
  </div>

  <nav class="navbar">
  <div class="nav-links">
    <a href="/" class="nav-button">Home</a>
    <a href="/about" class="nav-button">About</a>
    <a href="/meal-types" class="nav-button">Meal Types</a>
  </div>
  
  <form action="/search" method="GET" class="nav-search-form">
    <input type="text" name="query" placeholder="Search recipes..." class="nav-search">
    <button type="submit" class="search-btn">Search</button>
  </form>
</nav>

  <div class="main-wrapper">
    
    <div class="content-area">
        <div class="recipe-container">
            <div class="recipe-title">
                <h1>{{ Recipes[1][1]}}</h1> 
            </div>
            <div class="recipe-image">
                 <img src="{{ Recipes[0][3] }}" alt="Recipe Image" style="max-width: 100%;">
            </div>
        </div>

        <div class="recipe-info">
            <p><strong>Ingredients:</strong> {{ Recipes[0][4] }}</p>
            
        </div>
    </div>

    
    <div class="sidebar">
        <h2>Pantry</h2>
        <input type="text" placeholder="Search Ingredients">
        <h3>Common</h3>
        <p>Olive Oil</p>
        <p>Bread</p>
        
    </div>
</div>
