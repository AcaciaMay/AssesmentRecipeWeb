<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecipeWeb</title>
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">   
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Alice">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<header class="header.section">
    <div class="main-title">
        <h1>RecipeWeb</h1>
        <p class="subtitle">Search for recipes based on your ingredients.</p>
    </div>
</header>

<nav class="navbar">
    <div class="nav-links">
        <a href="/" class="nav-button">Home</a>
        <a href="/about" class="nav-button">About</a>
        
        
        <div class="dropdown">
            <button class="nav-button dropdown-trigger">Meal Types ▾</button>
            <div class="dropdown-content">
                <div class="filter-bar">
                    {% for meal in categories %}
                        <a href="{{ url_for('home', category=meal) }}" 
                           class="filter-pill {% if meal == selected_category %}active{% endif %}">
                            {{ meal }}
                        </a>
                    {% endfor %}
                    
                    {% if selected_category %}
                        <a href="{{ url_for('home') }}" class="clear-link">Clear Filter</a>
                    {% endif %}
                </div>
            </div>
        </div>

        <form action="/search" method="GET" class="nav-search-form">
            <input type="text" name="query" placeholder="Search recipes..." class="nav-search">
        </form>
    </div>
</nav>


<div class="main-wrapper">
    
    <div class="content-area">
        <div class="recipe-section">
            {% for recipe in recipes %}
             <a href="{{ url_for('recipe_detail', recipeid=recipe[0]['RecipeID']) }}" class="recipe-card-link">
            <div class="recipe-container">
                <div class="recipe-title">
                    <h1>{{ recipe[1]['Title'] }}</h1> 
                </div>
                <div class="recipe-image">
                    <img src="{{ url_for('static', filename=recipe['Image']) }}" alt="Recipe Image">
                </div>
                <div class="recipe-info">
                    <p><strong>Ingredients:</strong> {{ recipe['Ingredients'] }}</p>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
         <div class="sidebar" style="width: 250px; margin-left: 20px;">
    <h2>Pantry</h2>
    <input type="text" id="ingredientSearch" placeholder="Search Ingredients">
    
    
    <label for="categoryFilter">Category:</label>
    <select id="categoryFilter">
        <option value="all">All Categories</option>
        <option value="common">Common</option>
        <option value="vegetables">Vegetables</option>
        <option value="meat">Meat</option>
        <option value="dairy">Dairy</option>
        <option value="baking">Baking</option>
        <option value="fruit">Fruit</option>
        <option value="mushrooms">Mushrooms</option>
        <option value="berries">Berries</option>
        <option value="grains">Grains</option>
        <option value="substitutes">Substitutes</option>
    </select>
</div>
</div>
</body>
</html>
